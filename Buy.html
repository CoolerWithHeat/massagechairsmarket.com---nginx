    <script>
        function importScript(pathname, callback) {
            const existingScript = document.querySelector(`script[src="${pathname}"]`)
            if (!existingScript){
                const script = document.createElement('script');
                script.src = pathname;
                script.async = true;
                script.onload = callback || null;
                document.head.appendChild(script);
            }else{
                if (callback instanceof Function){callback()}
            }
        };

		function importCSS(pathname, callback = null) {
            const existingLink = document.querySelector(`link[href="${pathname}"]`);
            if (!existingLink){
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.type = 'text/css';
                link.href = pathname;
                link.onload = callback; 
                document.head.appendChild(link);
            }else{
                if (callback){callback()}
            }
		};
        importScript('/static/js/custom.js')
        importCSS('/static/css/comments.css')
        importCSS('https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900&display=swap')
        importCSS('/static/css/font-awesome.css')
        importCSS('/static/css/ratings.css')
        importCSS('/static/css/CartAnimation.css')
        importCSS('/static/css/productDescriptionStyle.css')

        importCSS('https://cdn.jsdelivr.net/npm/@mdi/font@5.4.55/css/materialdesignicons.min.css')
        importCSS('/static/css/cart.css')
        importCSS('/static/css/slider.css')
        importCSS('/static/css/custombuttons.css')
        importCSS('/static/css/warnings.css')
        importCSS('/static/css/skeletonLoading.css')
        importScript('/static/js/Buy_Base.js')
        importScript('/static/js/analytics.js')
        importScript('https://www.googletagmanager.com/gtag/js?id=G-YPTBVN0S8C', () => {
            window.dataLayer = window.dataLayer || [];
            window.gtag = function() { window.dataLayer.push(arguments); };
            gtag('js', new Date());
            gtag('config', 'G-YPTBVN0S8C');

            window.recordEvent = (event_label, category)=> window.gtag('event', 'click', {
                    'event_category': category,
                    'event_label': event_label,
                });
            });
    </script>
