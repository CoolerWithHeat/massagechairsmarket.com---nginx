    <script>        
        function importScript(pathname, callback) {
            const existingScript = document.querySelector(`script[src="${pathname}"]`)
            if (!existingScript){
                const script = document.createElement('script');
                script.src = pathname;
                script.async = true;
                script.onload = callback || null;
                document.head.appendChild(script);
            }else{
                if (callback instanceof Function){callback()}
            }
        };

        function importCSS(pathname, callback = null) {
            const existingLink = document.querySelector(`link[href="${pathname}"]`);
            if (!existingLink){
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.type = 'text/css';
                link.href = pathname;
                link.onload = callback; 
                document.head.appendChild(link);
            }else{
                if (callback){callback()}
            }
        };
        importScript('/static/js/SliderHandler.js')
        importCSS('/static/css/masterCardAnimation.css')
        importCSS('/static/css/cart.css')
        importCSS('/static/css/CartAnimation.css')
        importScript('/static/js/analytics.js')
    </script>
