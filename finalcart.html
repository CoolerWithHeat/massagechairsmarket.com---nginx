<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="/static/images/MC-logo.png" type="image/png">
    <link rel="stylesheet" href="/static/css/brandAnimation.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/7.1.0/mdb.min.css" rel="stylesheet"/>
    <link rel="stylesheet" type="text/css" href="/static/css/BuyCart.css">
</head>
    </head>
    
    <body>

    <div id="preloader">
        <div class="jumper">
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>
    <div id="ErrorWindow"></div>
    <div id="loadingWindow" class="invisibleField" style="margin: auto;width: 99%; height: 99%; z-index: 9; background-color: rgb(199, 199, 199); opacity: 0.8; position: fixed;">
      <div id="loader" style="transform: translate(-50%, -50%); top: 50%; left: 50%; position: absolute;" class="loader"></div>
    </div>
    <div id="shipmentFormWindow" style="display: none;" class="centered-div"></div>
    <section class="h-100 h-custom" style="background-color: #eee;">
        <div class="container py-5 h-100">
          <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col">
              <div class="card">
                <div class="card-body p-4">
                  
                  <div class="row">
                    
                    <div id="CartProductsClosure" class="col-lg-7"></div>

                    <div class="col-lg-5">
                      <div style="min-height: 500px;" id="HtmlCardBase" class="card bg-primary text-white rounded-3"></div>
                    </div>
                  </div>
                  
                </div>
              </div>
            </div>
          </div>
        </div>
    </section>

    <script src="/static/js/jquery-2.1.0.min.js"></script>
    <script src="/static/js/custom.js" async></script>
    <script>
      function importScript(pathname, callback) {
          const existingScript = document.querySelector(`script[src="${pathname}"]`)
          if (!existingScript){
          const script = document.createElement('script');
          script.src = pathname;
          script.async = true;
          script.onload = callback || null;
          document.head.appendChild(script);
          }else{
          if (callback){callback()}
          }
      };

      function importCSS(pathname, callback = null) {
          const existingLink = document.querySelector(`link[href="${pathname}"]`);
          if (!existingLink){
              const link = document.createElement('link');
              link.rel = 'stylesheet';
              link.type = 'text/css';
              link.href = pathname;
              link.onload = callback; 
              document.head.appendChild(link);
          }else{
              if (callback){callback()}
          }
      };

      importCSS('/static/css/discountfield.css')
      importCSS('/static/css/animationonly.css')
      importCSS('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css')
      importCSS('/static/css/AnimatedButtonCart.css')
      importCSS('https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap')
      importScript('/static/js/Cart_Base.js')
      importScript('https://js.stripe.com/v3/')

    </script>

</body>
</html>
